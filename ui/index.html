<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keelvane Harness</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="slab" x="2" y="6" width="5" height="20" rx="2" />
        <rect class="slab" x="10" y="6" width="5" height="20" rx="2" />
        <rect class="slab accent" x="18" y="6" width="5" height="20" rx="2" />
        <rect class="slab" x="26" y="6" width="5" height="20" rx="2" />
      </svg>
      <div class="brand-text">
        <span class="brand-name">Keelvane</span>
        <span class="brand-sub">Harness</span>
      </div>
    </div>
    <div class="new-session">
      <span class="field-label">New sessions use</span>
      <div id="engineToggle" class="engine-toggle" role="radiogroup" aria-label="Engine">
        <button type="button" class="engine-opt active" data-engine="claude" role="radio" aria-checked="true">Claude</button>
        <button type="button" class="engine-opt" data-engine="codex" role="radio" aria-checked="false">Codex</button>
      </div>
      <label class="field-label" for="modelSelect">Model</label>
      <select id="modelSelect"></select>
    </div>
    <div class="sidebar-section-label">Projects</div>
    <div id="sessionList"></div>
  </aside>
  <main id="main">
    <header id="sessionHeader">
      <button id="sidebarToggle" class="icon-btn sidebar-toggle" type="button" aria-label="Toggle sessions">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M2 3h12M2 8h12M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
        </svg>
      </button>
      <div class="session-meta">
        <span id="hdrVault" class="vault-chip"></span>
        <span id="hdrEngine" class="engine-badge"></span>
        <span id="hdrModel" class="model-name"></span>
      </div>
      <span id="hdrStatus" class="status-pill idle">
        <span class="dot"></span>
        <span class="label">no session</span>
      </span>
      <button id="archiveBtn" class="icon-btn" type="button" aria-label="Archive session" title="Archive session" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M2 3h12v3H2zM3 6v7h10V6M6.5 9h3" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none" />
        </svg>
      </button>
      <button id="insightsToggle" class="icon-btn" type="button" aria-label="Toggle insights">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M2 14V8M6 14V4M10 14V6M14 14V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
        </svg>
      </button>
    </header>
    <div id="chat"></div>
    <form id="composerForm">
      <div id="attachRow" class="attach-row"></div>
      <textarea id="composerText" rows="2" placeholder="Message Keelvane, or type / for skills"></textarea>
      <div class="composer-footer">
        <div class="composer-tools">
          <button type="button" id="attachBtn" class="icon-btn" aria-label="Attach files">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M13.5 7.5l-5.8 5.8a3.5 3.5 0 0 1-5-5l6.2-6.2a2.3 2.3 0 0 1 3.3 3.3L6 11.6a1.1 1.1 0 0 1-1.6-1.6l5.6-5.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" />
            </svg>
          </button>
          <input type="file" id="fileInput" multiple hidden />
          <span class="composer-hint">Enter to send, / for skills, drop or paste files to attach</span>
        </div>
        <div class="composer-buttons">
          <button type="button" id="stopBtn" disabled>Stop</button>
          <button type="submit" id="sendBtn">Send</button>
        </div>
      </div>
    </form>
  </main>
  <aside id="insights" aria-label="Session insights">
    <div class="insights-tabs" role="tablist">
      <button type="button" class="insights-tab active" data-tab="insights" role="tab" aria-selected="true">Insights</button>
      <button type="button" class="insights-tab" data-tab="git" role="tab" aria-selected="false">Git <span id="gitBadge" class="tab-badge"></span></button>
    </div>
    <div id="insightsPane">
    <section class="panel">
      <h2>Tokens</h2>
      <div id="tokenTotals" class="stat-grid"></div>
      <svg id="tokenChart" class="token-chart" viewBox="0 0 260 90" preserveAspectRatio="none"></svg>
      <div class="legend">
        <span class="lg fresh">Input</span>
        <span class="lg cached">Cached</span>
        <span class="lg output">Output</span>
      </div>
    </section>
    <section class="panel">
      <h2>Tool activity</h2>
      <div id="toolBars"></div>
    </section>
    <section class="panel">
      <h2>Files changed</h2>
      <ul id="fileList" class="file-list"></ul>
    </section>
    <section class="panel">
      <h2>Approvals</h2>
      <div id="approvalStats"></div>
    </section>
    </div>
    <div id="gitPane" hidden></div>
  </aside>
</div>
  <script type="module" src="app.js"></script>
</body>
</html>
